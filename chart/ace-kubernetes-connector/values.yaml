# Ace shows the values for your connection during setup.

# Connector ID issued by Ace.
connectorId: ""
# read: get/list across the cluster (or only the selected namespaces), no Secret access.
# write: broad access in the selected namespaces for approved changes. Install it as a separate release.
mode: read
# HTTPS origin of your Ace installation, without a path.
apiUrl: ""
# Display name of this cluster in Ace.
clusterName: ""
# Namespaces Ace watches. The writer may act only in these.
namespaces: []
# Reader only: read every namespace, not just the selected ones. Unset means true
# for a newly installed reader and false on an upgrade, so an existing reader never
# widens without an explicit value; a writer is always limited to the selected namespaces.
allNamespaces: null
# Also grant cluster-scoped access (read: nodes, namespaces, storage, RBAC and
# admission webhooks; write: every API group and verb). Unset means true for a
# newly installed reader, false on an upgrade and false for a writer.
clusterResources: null

image:
  repository: ghcr.io/vratix-dev/ace-kubernetes-connector
  # Released charts set the digest of the image they were tested with.
  digest: ""

# Names of existing registry Secrets in the release namespace.
imagePullSecrets: []

# The Ace connector credential. Prefer existingSecret: the name of a Secret in
# the release namespace with the credential under the key "token".
existingSecret: ""
# Alternatively pass the credential with --set-file token=PATH. Helm then
# stores it in the release record.
token: ""
