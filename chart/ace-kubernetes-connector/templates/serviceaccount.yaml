{{- include "connector.validate" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "connector.name" . }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
{{- if .Values.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "connector.name" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  token: {{ trim .Values.token | quote }}
{{- end }}
