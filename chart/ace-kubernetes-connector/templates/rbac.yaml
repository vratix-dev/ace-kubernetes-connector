{{- $name := include "connector.name" . -}}
# Identifies the cluster by the kube-system namespace UID.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-identity
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-identity
subjects:
  {{- include "connector.subject" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-identity
{{- if eq (include "connector.allNamespaces" .) "true" }}
---
# The connector's namespaced access, in every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-namespaces
rules:
  {{- if eq .Values.mode "read" }}
  {{- include "connector.readRules" . | nindent 2 }}
  {{- else }}
  {{- include "connector.writeRules" . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-namespaces
subjects:
  {{- include "connector.subject" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-namespaces
{{- else }}
{{- range .Values.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ . }}
rules:
  {{- if eq $.Values.mode "read" }}
  {{- include "connector.readRules" $ | nindent 2 }}
  {{- else }}
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: [get, list, patch, create, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ . }}
subjects:
  {{- include "connector.subject" $ | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
{{- end }}
{{- end }}
{{- if eq (include "connector.clusterResources" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  {{- if eq .Values.mode "read" }}
  {{- include "connector.clusterReadRules" . | nindent 2 }}
  {{- else }}
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
subjects:
  {{- include "connector.subject" . | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
{{- end }}
